<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboto Font Example</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: "Roboto", sans-serif;
            padding: 20px;
            line-height: 1.8;
        }

        .thin{
            font-weight: 100;
        }

        .light{
            font-weight: 300;
        }

        .regular{
            font-weight: 400;
        }

        .medium{
            font-weight: 500;
        }

        .bold{
            font-weight: 700;
        }

        .black{
            font-weight: 900;
        }

        .italic{
            font-style: italic;
        }

    </style>
</head>

<body>

    <h1>Roboto Font Examples</h1>

    <p class="thin">
        This is Roboto Thin (100)
    </p>

    <p class="light">
        This is Roboto Light (300)
    </p>

    <p class="regular">
        This is Roboto Regular (400)
    </p>

    <p class="medium">
        This is Roboto Medium (500)
    </p>

    <p class="bold">
        This is Roboto Bold (700)
    </p>

    <p class="black">
        This is Roboto Black (900)
    </p>

    <p class="italic">
        This is Roboto Italic Text
    </p>

    <p>
        I <em>never</em> said he stole your money
    </p>

    <p>
        The quick brown fox jumps over the lazy dog.
    </p>

</body>
</html>
